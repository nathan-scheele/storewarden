query GetInventory($id: ID!) {
  inventoryItem(id: $id) {
    inventoryLevels(first: 100) {
      nodes {
        location {
          id
          name
        }
        quantities(names: ["available", "on_hand", "damaged", "quality_control", "safety_stock"]) {
          name
          quantity
        }
      }
    }
  }
}
